[project]
name = "meeting-scheduling-agent"
version = "0.1.0"
description = "Synthetic calendar meeting scheduling with OpenAI Agents SDK"
requires-python = ">=3.12"
dependencies = ["openai-agents==0.23.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
schedule-meeting = "meeting_scheduler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
